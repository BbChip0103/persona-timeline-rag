# Template-only profile. External Secrets must provision the named Secrets.
data:
  enabled: false
app:
  web: {replicas: 2}
  api: {replicas: 2}
gateway:
  bootstrap:
    # Documentation placeholder only: replace with the cluster API endpoint CIDR.
    apiServerCIDRs: ["192.0.2.1/32"]
  data:
    enabled: false
  managedData:
    postgres:
      # Documentation placeholder only: TEST-NET-1, replace with managed LiteLLM Postgres CIDRs.
      cidrs: ["192.0.2.0/24"]
    redis:
      # Documentation placeholder only: TEST-NET-2, replace with managed LiteLLM Redis CIDRs.
      cidrs: ["198.51.100.0/24"]
  fakeOpenRouter:
    enabled: false
  openrouter:
    baseUrl: https://openrouter.ai/api/v1
  prod:
    # Documentation placeholder only: TEST-NET-3, replace with approved egress ranges.
    # CIDR egress narrows destinations but is not host pinning; use an egress proxy
    # or FQDN-aware policy when strict hostname control is required.
    externalHttpsCidrs: ["203.0.113.0/24"]
secrets:
  api: {existingSecret: ptr-api}
  worker: {existingSecret: ptr-worker}
  maintenance: {existingSecret: ptr-maintenance}
  personas: {existingSecret: ptr-personas}
network:
  postgres:
    host: postgres.example.invalid
    port: 5432
    scheme: postgresql
    database: ptr_split_research
  redis:
    host: redis.example.invalid
    port: 6379
    scheme: rediss
    username: ptr
policy:
  managedData:
    postgres:
      # Documentation placeholder only: TEST-NET-1, replace with managed Postgres CIDRs.
      cidrs: ["192.0.2.0/24"]
    redis:
      # Documentation placeholder only: TEST-NET-2, replace with managed Redis CIDRs.
      cidrs: ["198.51.100.0/24"]
inference:
  engine:
    kind: vllm
    # Rolling updates with maxUnavailable=0 need one spare GPU above steady state.
    replicas: 2
    rollout:
      maxSurge: 1
      maxUnavailable: 0
    model: Qwen/Qwen3-8B
    modelPath: /models/qwen3-8b
    maxNumSeqs: 8
    dtype: bfloat16
    enforceEager: true
    maxModelLen: 16384
    weights:
      existingClaim: ptr-qwen3-8b
      mountPath: /models
      shmSizeLimit: 8Gi
    image:
      repository: vllm/vllm-openai
      tag: v0.18.0
      digest: sha256:c32358ebfc115d56ade2acfdbcd00df5b115417dbd6006547c88f07e2b39de06
      pullPolicy: IfNotPresent
    nodeSelector:
      ptr.io/gpu-pool: "true"
    tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
    resources:
      requests: {cpu: "4", memory: 16Gi}
      limits: {memory: 32Gi}
  apiServerCIDRs: ["192.0.2.1/32"] # Replace with the cluster API endpoint CIDR before installing.
  apiServerPort: 443 # Use 6443 for direct kube-apiserver endpoints.
