        c3dlcmVkXCIsXCJldmlkZW5jZVJlZnNcIjpbXSxcInZhcmlhYmxlVXBkYXRlc1wiOnt9fSJdfQ0A
        AAABAfcAAfcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABwEDFQlsbG1k
    interTokenLatency: 0s
    enableRequestIdHeaders: true
    logHttp: true
  testClient:
    enabled: true
  apiServerCIDRs: ["10.96.0.1/32"]
  apiServerPorts: [443, 6443]
autoscaling:
  hpa:
    web: {minReplicas: 2, maxReplicas: 3}
    api: {minReplicas: 2, maxReplicas: 4}
    litellm: {minReplicas: 2, maxReplicas: 3}
  worker:
    maxReplicaCount: 6
  engine:
    maxReplicaCount: 2
    # Kind uses a short window so V6 can prove scale-up and return-to-min quickly.
    scaleDownStabilizationSeconds: 60
maintenance:
  enabled: true
  jobs:
    dailySplitRetention:
      enabled: true
    dailyFrameworkRetention:
      enabled: true
    weeklyReviewSample:
      enabled: true
      syntheticSmoke: true
    weeklyProductionReview:
      enabled: true
      syntheticSmoke: true
