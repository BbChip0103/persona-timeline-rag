{{- if .Values.namespaces.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.app }}
  labels:
    ptr.io/namespace: app
---
{{- if .Values.data.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.data }}
  labels:
    ptr.io/namespace: data
{{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.inference }}
  labels:
    ptr.io/namespace: inference
{{- end }}
