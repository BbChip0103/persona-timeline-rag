{{- if and .Values.data.enabled .Release.IsInstall }}
{{- $ns := .Values.namespaces.data -}}
{{- $secret := .Values.secrets.data.existingSecret -}}
{{- $workerImage := printf "%s:%s" .Values.images.worker.repository .Values.images.worker.tag -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ptr-bootstrap-script
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: ptr
    app.kubernetes.io/component: bootstrap
data:
  bootstrap-kind.py: |-
{{ .Files.Get "files/bootstrap-kind.py" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ptr-bootstrap-migrations
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: ptr
    app.kubernetes.io/component: bootstrap
data:
{{- range $path, $_ := .Files.Glob "files/supabase/migrations/*.sql" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ptr-bootstrap-split
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: ptr
    app.kubernetes.io/component: bootstrap
data:
{{- range $path, $_ := .Files.Glob "files/supabase/split/*.sql" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ptr-bootstrap
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: ptr
    app.kubernetes.io/component: bootstrap
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ptr
        app.kubernetes.io/component: bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: {{ $workerImage | quote }}
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          env:
            - name: PTR_NETWORK_MODE
              value: cluster
            - name: PTR_LLM_DATABASE_URL_ALLOWLIST
              value: "postgresql://ptr_split_owner@ptr-postgres.ptr-data.svc:5432/ptr_split_test"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: POSTGRES_PASSWORD
            - name: PTR_SPLIT_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: PTR_SPLIT_APP_PASSWORD
            - name: PTR_SPLIT_LLM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: PTR_SPLIT_LLM_PASSWORD
            - name: PYTHONPYCACHEPREFIX
              value: /tmp/pycache
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              python - <<'PY' > /tmp/roles.env
              import os
              from urllib.parse import quote
              host = "ptr-postgres.ptr-data.svc:5432/ptr_split_test"
              roles = [
                  ("OWNER", "ptr_split_owner", "POSTGRES_PASSWORD"),
                  ("APP", "ptr_split_app", "PTR_SPLIT_APP_PASSWORD"),
                  ("LLM", "ptr_split_llm", "PTR_SPLIT_LLM_PASSWORD"),
              ]
              for role, user, key in roles:
                  password = quote(os.environ[key], safe="")
                  print(f"PTR_SPLIT_TEST_{role}_DATABASE_URL=postgresql://{user}:{password}@{host}")
              PY
              python /bootstrap/bootstrap-kind.py --roles-env /tmp/roles.env --sql-root /bootstrap/supabase
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 900
            runAsGroup: 2000
          resources:
{{ toYaml .Values.app.worker.resources | indent 12 }}
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap/bootstrap-kind.py
              subPath: bootstrap-kind.py
              readOnly: true
            - name: bootstrap-migrations
              mountPath: /bootstrap/supabase/migrations
              readOnly: true
            - name: bootstrap-split
              mountPath: /bootstrap/supabase/split
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: ptr-bootstrap-script
        - name: bootstrap-migrations
          configMap:
            name: ptr-bootstrap-migrations
        - name: bootstrap-split
          configMap:
            name: ptr-bootstrap-split
        - name: tmp
          emptyDir: {}
{{- end }}
