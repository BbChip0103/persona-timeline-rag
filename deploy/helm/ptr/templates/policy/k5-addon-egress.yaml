{{- if ne .Values.policy.enabled false }}
{{- $app := .Values.namespaces.app -}}
{{- $data := .Values.namespaces.data -}}
{{- $inference := .Values.namespaces.inference -}}
{{- $apiServerCidrs := default (list) .Values.policy.apiServerCIDRs -}}
{{- $apiServerPorts := default (list 443) .Values.policy.apiServerPorts -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ptr-monitoring-default-deny
  namespace: ptr-monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ptr-keda-default-deny
  namespace: ptr-keda
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ptr-keda-operator-egress
  namespace: ptr-keda
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: keda-operator}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- range $apiServerCidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports:
        {{- range $apiServerPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
    {{- if .Values.data.enabled }}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $data }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: ptr, app.kubernetes.io/component: redis}
      ports: [{protocol: TCP, port: {{ .Values.network.redis.port }}}]
    {{- else }}
    {{- range .Values.policy.managedData.redis.cidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{protocol: TCP, port: {{ $.Values.network.redis.port }}}]
    {{- end }}
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ptr-monitoring}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports: [{protocol: TCP, port: 9090}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: keda-operator-metrics-apiserver}
      ports: [{protocol: TCP, port: 6443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ptr-keda-operator-grpc-ingress
  namespace: ptr-keda
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: keda-operator}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: keda-operator-metrics-apiserver}
      ports: [{protocol: TCP, port: 9666}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ptr-keda-metrics-grpc-egress
  namespace: ptr-keda
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: keda-operator-metrics-apiserver}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: keda-operator}
      ports: [{protocol: TCP, port: 9666}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ptr-keda-apiserver-ingress
  namespace: ptr-keda
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [keda-admission-webhooks, keda-operator-metrics-apiserver]}
  policyTypes: [Ingress]
  ingress:
    {{- range $apiServerCidrs }}
    - from: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports:
        - {protocol: TCP, port: 9443}
        - {protocol: TCP, port: 6443}
    {{- end }}
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: keda-operator}
      ports: [{protocol: TCP, port: 6443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ptr-keda-control-plane-egress
  namespace: ptr-keda
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: keda-operator}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- range $apiServerCidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports:
        {{- range $apiServerPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ptr-prometheus-egress
  namespace: ptr-monitoring
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- range $apiServerCidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports:
        {{- range $apiServerPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ptr-monitoring}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports: [{protocol: TCP, port: 9090}, {protocol: TCP, port: 8080}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ptr-monitoring}
          podSelector:
            matchLabels: {app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator}
      ports: [{protocol: TCP, port: 10250}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ptr-monitoring}
          podSelector:
            matchLabels: {app.kubernetes.io/name: kube-state-metrics}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $app }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: ptr, app.kubernetes.io/component: api}
      ports: [{protocol: TCP, port: 56441}]
    {{- if .Values.inference.enabled }}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $inference }}}
          podSelector:
            matchLabels: {llm-d-router-standalone: {{ .Values.inference.routerService }}}
      ports: [{protocol: TCP, port: 9090}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $inference }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: ptr, app.kubernetes.io/component: inference-engine}
      ports: [{protocol: TCP, port: 8000}]
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ptr-kube-state-metrics-egress
  namespace: ptr-monitoring
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: kube-state-metrics}
  policyTypes: [Egress]
  egress:
    {{- range $apiServerCidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports:
        {{- range $apiServerPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ptr-prometheus-operator-egress
  namespace: ptr-monitoring
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: prometheus-operator}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- range $apiServerCidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports:
        {{- range $apiServerPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
{{- end }}
