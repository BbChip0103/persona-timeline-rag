{{- if .Values.autoscaling.worker.enabled }}
{{- $redisTLS := eq .Values.network.redis.scheme "rediss" -}}
{{- $caTLS := and $redisTLS .Values.autoscaling.worker.redis.caKey -}}
{{- $prometheusAddress := default (printf "http://%s-kube-promet-prometheus.%s.svc:%v" .Values.monitoring.prometheus.releaseName .Values.monitoring.prometheus.namespace .Values.monitoring.prometheus.port) .Values.autoscaling.engine.prometheus.serverAddress -}}
{{- $engineDeployment := printf "ptr-%s" .Values.inference.engine.kind -}}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ .Values.autoscaling.worker.redis.triggerAuthenticationName }}
  namespace: {{ .Values.namespaces.app }}
spec:
  secretTargetRef:
    - parameter: address
      name: {{ .Values.autoscaling.worker.redis.existingSecret }}
      key: {{ .Values.autoscaling.worker.redis.addressKey }}
    - parameter: username
      name: {{ .Values.autoscaling.worker.redis.existingSecret }}
      key: {{ .Values.autoscaling.worker.redis.usernameKey }}
    - parameter: password
      name: {{ .Values.autoscaling.worker.redis.existingSecret }}
      key: {{ .Values.autoscaling.worker.redis.passwordKey }}
    {{- if $caTLS }}
    - parameter: tls
      name: {{ .Values.autoscaling.worker.redis.existingSecret }}
      key: {{ required "autoscaling.worker.redis.tlsKey is required with Redis CA" .Values.autoscaling.worker.redis.tlsKey }}
    - parameter: ca
      name: {{ .Values.autoscaling.worker.redis.existingSecret }}
      key: {{ .Values.autoscaling.worker.redis.caKey }}
    {{- end }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ptr-worker
  namespace: {{ .Values.namespaces.app }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ptr-worker
  pollingInterval: {{ .Values.autoscaling.worker.pollingInterval }}
  cooldownPeriod: {{ .Values.autoscaling.worker.cooldownPeriod }}
  minReplicaCount: {{ .Values.autoscaling.worker.minReplicaCount }}
  maxReplicaCount: {{ .Values.autoscaling.worker.maxReplicaCount }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.autoscaling.worker.scaleDownStabilizationSeconds }}
    scalingModifiers:
      formula: {{ printf "min(max(wait / %v, active / %v), ceil(engines * %v * (scaling_up > 0 ? %v : %v) / %v))" .Values.autoscaling.worker.redis.waitListLength .Values.app.worker.concurrency .Values.inference.engine.maxNumSeqs .Values.autoscaling.worker.scaleUpHeadroom .Values.autoscaling.worker.steadyHeadroom .Values.app.worker.concurrency | quote }}
      target: "1"
      metricType: AverageValue
  fallback:
    failureThreshold: {{ .Values.autoscaling.worker.fallback.failureThreshold }}
    replicas: {{ .Values.autoscaling.worker.fallback.replicas }}
    behavior: {{ .Values.autoscaling.worker.fallback.behavior }}
  triggers:
    - type: redis
      name: wait
      metadata:
        listName: {{ .Values.autoscaling.worker.redis.waitList | quote }}
        listLength: {{ .Values.autoscaling.worker.redis.waitListLength | quote }}
        activationListLength: {{ .Values.autoscaling.worker.redis.waitActivationListLength | quote }}
        {{- if and $redisTLS (not $caTLS) }}
        enableTLS: "true"
        {{- end }}
      authenticationRef:
        name: {{ .Values.autoscaling.worker.redis.triggerAuthenticationName }}
    - type: redis
      name: active
      metadata:
        listName: {{ .Values.autoscaling.worker.redis.activeList | quote }}
        listLength: {{ .Values.app.worker.concurrency | quote }}
        {{- if and $redisTLS (not $caTLS) }}
        enableTLS: "true"
        {{- end }}
      authenticationRef:
        name: {{ .Values.autoscaling.worker.redis.triggerAuthenticationName }}
    - type: prometheus
      name: engines
      metadata:
        serverAddress: {{ $prometheusAddress | quote }}
        metricName: ptr_ready_engines
        query: {{ printf "max(kube_deployment_status_replicas_ready{namespace=%q,deployment=%q})" .Values.namespaces.inference $engineDeployment | quote }}
        threshold: "1"
        ignoreNullValues: "false"
    - type: prometheus
      name: scaling_up
      metadata:
        serverAddress: {{ $prometheusAddress | quote }}
        metricName: ptr_engine_scaling_up
        query: {{ printf "(max(kube_deployment_spec_replicas{namespace=%q,deployment=%q}) > bool max(kube_deployment_status_replicas_ready{namespace=%q,deployment=%q})) or vector(0)" .Values.namespaces.inference $engineDeployment .Values.namespaces.inference $engineDeployment | quote }}
        threshold: "1"
{{- end }}
