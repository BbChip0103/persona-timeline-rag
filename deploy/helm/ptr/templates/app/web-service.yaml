apiVersion: v1
kind: Service
metadata:
  name: ptr-web
  namespace: {{ .Values.namespaces.app }}
  labels:
    app.kubernetes.io/name: ptr
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ptr
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 56440
      targetPort: http
