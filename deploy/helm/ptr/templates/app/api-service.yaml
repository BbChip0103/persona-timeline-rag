apiVersion: v1
kind: Service
metadata:
  name: ptr-api
  namespace: {{ .Values.namespaces.app }}
  labels:
    app.kubernetes.io/name: ptr
    app.kubernetes.io/component: api
    ptr.io/monitoring: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ptr
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 56441
      targetPort: http
