apiVersion: apps/v1
kind: Deployment
metadata:
  name: ptr-worker
  namespace: {{ .Values.namespaces.app }}
  labels:
    app.kubernetes.io/name: ptr
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.autoscaling.worker.enabled }}
  replicas: {{ .Values.app.worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ptr
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ptr
        app.kubernetes.io/component: worker
        ptr.network/role: app
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 100
      securityContext:
        runAsNonRoot: true
        runAsUser: 900
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-schema
          image: "{{ .Values.images.worker.repository }}:{{ .Values.images.worker.tag }}"
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          command: ["python", "-c"]
          args:
            - |
              import os
              import sys
              import time
              import psycopg
              deadline = time.monotonic() + 180
              while time.monotonic() < deadline:
                  try:
                      with psycopg.connect(os.environ["PTR_LLM_DATABASE_URL"], connect_timeout=3) as db:
                          row = db.execute("SELECT to_regclass('llm.checkpoints')").fetchone()
                          if row and row[0] is not None:
                              sys.exit(0)
                  except psycopg.Error:
                      pass
                  print("waiting for split schema", flush=True)
                  time.sleep(2)
              raise SystemExit("SCHEMA_READY_TIMEOUT")
          env:
            - name: PTR_LLM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.worker.existingSecret }}
                  key: PTR_LLM_DATABASE_URL
            - name: PYTHONPYCACHEPREFIX
              value: /tmp/pycache
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 900
            runAsGroup: 2000
          resources:
            {{- toYaml .Values.app.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: worker
          image: "{{ .Values.images.worker.repository }}:{{ .Values.images.worker.tag }}"
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          command: ["python", "-m", "ptr_llm", "worker"]
          ports:
            - name: http
              containerPort: 58442
          env:
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            - name: PTR_NETWORK_MODE
              value: cluster
            - name: PTR_LLM_SERVICE_MODE
              value: split
            - name: PTR_LLM_HOST
              value: 0.0.0.0
            - name: PTR_LLM_PORT
              value: "58442"
            - name: PTR_LLM_BACKEND_URL
              value: {{ .Values.network.api.url | quote }}
            - name: PTR_LLM_BACKEND_URL_ALLOWLIST
              value: {{ .Values.network.api.url | quote }}
            - name: PTR_LLM_REDIS_URL_ALLOWLIST
              value: "{{ .Values.network.redis.scheme }}://{{ .Values.network.redis.username }}@{{ .Values.network.redis.host }}:{{ .Values.network.redis.port }}"
            - name: PTR_LLM_DATABASE_URL_ALLOWLIST
              value: "{{ .Values.network.postgres.scheme }}://ptr_split_llm@{{ .Values.network.postgres.host }}:{{ .Values.network.postgres.port }}/{{ .Values.network.postgres.database }}"
            - name: PTR_LLM_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.worker.existingSecret }}
                  key: PTR_LLM_REDIS_URL
            - name: PTR_LLM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.worker.existingSecret }}
                  key: PTR_LLM_DATABASE_URL
            - name: PTR_LLM_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.worker.existingSecret }}
                  key: PTR_LLM_CONTROL_TOKEN
            - name: PTR_LLM_PROVIDER
              value: local
            - name: PTR_LLM_PUBLISHED_PERSONAS_FILE
              value: /etc/ptr-personas/personas.json
            - name: PTR_LLM_LOCAL_BASE_URL
              value: {{ .Values.llm.local.baseUrl | quote }}
            - name: PTR_LLM_LOCAL_MODEL
              value: {{ .Values.llm.local.model | quote }}
            - name: PTR_LLM_LOCAL_AUTH_REQUIRED
              value: {{ ternary "1" "0" .Values.llm.local.authRequired | quote }}
            - name: PTR_LLM_INPUT_BYTES
              value: {{ .Values.llm.local.inputBytes | quote }}
            - name: PTR_LLM_MODEL_TIMEOUT_MS
              value: {{ .Values.llm.local.timeoutMs | quote }}
            - name: PTR_LLM_SPILLOVER
              value: {{ .Values.llm.spillover | quote }}
            - name: PTR_LLM_OPENROUTER_MODEL
              value: {{ .Values.llm.openrouter.model | quote }}
            - name: PTR_LLM_OPENROUTER_KEY_MAX_LIMIT_USD
              value: {{ .Values.llm.openrouter.keyMaxLimitUsd | quote }}
            {{- if not (has .Values.llm.openrouter.keyLimitCheck (list "required" "skip")) }}
            {{- fail "llm.openrouter.keyLimitCheck must be required or skip" }}
            {{- end }}
            - name: PTR_LLM_OPENROUTER_KEY_LIMIT_CHECK
              value: {{ .Values.llm.openrouter.keyLimitCheck | quote }}
            {{- if .Values.llm.openrouter.syntheticProviderFixture }}
            - name: PTR_LLM_SYNTHETIC_PROVIDER_FIXTURE
              value: "1"
            {{- end }}
            {{- if .Values.llm.openrouter.baseUrlOverride }}
            - name: PTR_LLM_OPENROUTER_BASE_URL
              value: {{ .Values.llm.openrouter.baseUrlOverride | quote }}
            {{- end }}
            {{- if eq .Values.llm.spillover "openrouter" }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.workerOpenRouter.existingSecret }}
                  key: {{ .Values.secrets.workerOpenRouter.apiKeyKey }}
            {{- end }}
            - name: PTR_LLM_LIVE_ENABLED
              value: {{ .Values.llm.billing.liveEnabled | quote }}
            - name: PTR_LLM_ALLOW_EXTERNAL_DATA
              value: {{ .Values.llm.billing.allowExternalData | quote }}
            - name: PTR_LLM_PROMPT_USD_PER_M
              value: {{ .Values.llm.billing.promptUsdPerM | quote }}
            - name: PTR_LLM_COMPLETION_USD_PER_M
              value: {{ .Values.llm.billing.completionUsdPerM | quote }}
            - name: PTR_LLM_MAX_OUTPUT_TOKENS
              value: {{ .Values.llm.billing.maxOutputTokens | quote }}
            - name: PTR_LLM_MAX_CALL_MICROUSD
              value: {{ .Values.llm.billing.maxCallMicrousd | quote }}
            - name: PTR_LLM_QUEUE_NAME
              value: turns
            - name: PTR_LLM_QUEUE_PREFIX
              value: ptr
            - name: PTR_LLM_CONCURRENCY
              value: {{ .Values.app.worker.concurrency | quote }}
            - name: PTR_LLM_LOCK_DURATION_MS
              value: "30000"
            - name: PTR_LLM_STALLED_INTERVAL_MS
              value: "30000"
            - name: LANGFUSE_ENABLED
              value: "false"
            - name: LANGCHAIN_TRACING_V2
              value: "false"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.app.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: published-personas
              mountPath: /etc/ptr-personas
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: published-personas
          secret:
            secretName: {{ .Values.secrets.personas.existingSecret }}
            items:
              - key: PTR_LLM_PUBLISHED_PERSONAS_JSON
                path: personas.json
        - name: tmp
          emptyDir: {}
