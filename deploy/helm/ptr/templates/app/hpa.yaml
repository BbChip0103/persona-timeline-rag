{{- if .Values.autoscaling.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ptr-api
  namespace: {{ .Values.namespaces.app }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ptr-api
  minReplicas: {{ .Values.autoscaling.hpa.api.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.hpa.api.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.hpa.cpuUtilization }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ptr-web
  namespace: {{ .Values.namespaces.app }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ptr-web
  minReplicas: {{ .Values.autoscaling.hpa.web.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.hpa.web.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.hpa.cpuUtilization }}
{{- if .Values.gateway.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ptr-litellm
  namespace: {{ .Values.namespaces.gateway }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ptr-litellm
  minReplicas: {{ .Values.autoscaling.hpa.litellm.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.hpa.litellm.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.hpa.cpuUtilization }}
{{- end }}
{{- end }}
