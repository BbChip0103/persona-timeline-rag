apiVersion: apps/v1
kind: Deployment
metadata:
  name: ptr-web
  namespace: {{ .Values.namespaces.app }}
  labels:
    app.kubernetes.io/name: ptr
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.app.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ptr
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ptr
        app.kubernetes.io/component: web
        ptr.network/role: app
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 900
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          workingDir: /app/apps/web
          command: ["node", "/app/node_modules/next/dist/bin/next", "start", "--hostname", "0.0.0.0", "--port", "56440"]
          ports:
            - name: http
              containerPort: 56440
          env:
            - name: NODE_ENV
              value: production
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            - name: PTR_NETWORK_MODE
              value: cluster
            - name: PTR_WEB_HOST
              value: 0.0.0.0
            - name: PTR_CLUSTER_API_URL
              value: {{ .Values.network.api.url | quote }}
            - name: PTR_CLUSTER_API_NAMESPACE
              value: {{ .Values.namespaces.app | quote }}
            - name: PTR_CLUSTER_REDIS_URL_ALLOWLIST
              value: "{{ .Values.network.redis.scheme }}://{{ .Values.network.redis.username }}@{{ .Values.network.redis.host }}:{{ .Values.network.redis.port }}"
            - name: PTR_WEB_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.api.existingSecret }}
                  key: PTR_REDIS_URL
            - name: PTR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.api.existingSecret }}
                  key: PTR_API_TOKEN
            - name: PTR_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.api.existingSecret }}
                  key: PTR_SESSION_SECRET
            - name: PTR_UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.api.existingSecret }}
                  key: PTR_UI_PASSWORD
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.app.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
