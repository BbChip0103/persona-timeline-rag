{{- if and .Values.inference.enabled (gt (int .Values.inference.engine.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ptr-{{ .Values.inference.engine.kind }}
  namespace: {{ .Values.namespaces.inference }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ptr
      app.kubernetes.io/component: inference-engine
{{- end }}
