# K8s LiteLLM config: one local EPP-backed route plus one explicit paid spillover alias.
# No post-submission fallback or provider retry.
model_list:
  - model_name: primary
    litellm_params:
      model: os.environ/PTR_VLLM_MODEL
      api_base: http://chat-primary-epp.ptr-inference.svc.cluster.local:8081/v1
      api_key: os.environ/PTR_VLLM_API_KEY
      max_retries: 0
      timeout: 25
      chat_template_kwargs:
        enable_thinking: false
    model_info:
      id: local-pool
      mode: chat
      disable_background_health_check: true
  - model_name: openrouter-primary
    litellm_params:
      model: os.environ/PTR_OPENROUTER_MODEL
      api_base: os.environ/PTR_OPENROUTER_BASE_URL
      api_key: os.environ/PTR_OPENROUTER_API_KEY
      max_retries: 0
      timeout: 25
      extra_body:
        provider:
          order: [DeepInfra]
          allow_fallbacks: false
          require_parameters: true
          max_price: {prompt: 0.1, completion: 0.5}
    model_info:
      id: openrouter-primary
      mode: chat
      disable_background_health_check: true
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 0
  max_fallbacks: 0
  enable_weighted_failover: false
  fallbacks: []
  default_fallbacks: []
  context_window_fallbacks: []
  content_policy_fallbacks: []
  redis_host: ptr-litellm-redis.ptr-gateway.svc.cluster.local
  redis_port: 6379
  redis_password: os.environ/PTR_LITELLM_REDIS_PASSWORD
litellm_settings:
  callbacks: [ptr_budget_gate.gate]
  num_retries: 0
  request_timeout: 25
  drop_params: false
  set_verbose: false
  max_budget: 1.0
  budget_duration: 1d
  turn_off_message_logging: true
  redact_messages_in_exceptions: true
  store_prompts_in_spend_logs: false
  success_callback: [prometheus]
  require_auth_for_metrics_endpoint: false
general_settings:
  master_key: os.environ/PTR_LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  background_health_checks: false
  allow_requests_on_db_unavailable: false
  maximum_spend_logs_retention_period: 90d
  disable_error_logs: true
