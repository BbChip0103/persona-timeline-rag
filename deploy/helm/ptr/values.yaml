# Images are overridden with unique local tags by deploy/kind/up.sh.
images:
  backend:
    repository: ptr-backend
    tag: k2
    pullPolicy: IfNotPresent
  worker:
    repository: ptr-worker
    tag: k2
    pullPolicy: IfNotPresent
  postgres:
    repository: pgvector/pgvector
    digest: sha256:94aee7e88f98125114657cab98e28c5dfa8dd517a6bf83fd98b503439f1e3de6
    tag: 0.8.1-pg15
  redis:
    repository: redis
    digest: sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    tag: 7.4.5-alpine

namespaces:
  # Provisioned before chart install so existing Secrets can be created safely.
  create: false
  app: ptr-app
  data: ptr-data
  inference: ptr-inference

app:
  web:
    replicas: 2
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
  api:
    replicas: 2
    maxQueueMs: 60000
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
  worker:
    replicas: 2
    concurrency: 4
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: "2", memory: 2Gi}

autoscaling:
  hpa:
    enabled: true
    cpuUtilization: 70
    web:
      minReplicas: 2
      maxReplicas: 6
    api:
      minReplicas: 2
      maxReplicas: 10
  worker:
    enabled: true
    pollingInterval: 10
    cooldownPeriod: 120
    scaleDownStabilizationSeconds: 120
    minReplicaCount: 2
    maxReplicaCount: 40
    # The worker cap is ceil(ready_engines * engine.maxNumSeqs * headroom / concurrency).
    # steadyHeadroom keeps workers matched to ready GPU capacity. scaleUpHeadroom
    # applies only while the engine Deployment's desired replicas exceed ready replicas.
    steadyHeadroom: "1.0"
    scaleUpHeadroom: "1.25"
    # KEDA currentReplicasIfLower keeps the current worker count when it is
    # below fallback.replicas, and otherwise emits fallback.replicas. This
    # prevents a metrics outage from overcommitting a small run while capping a
    # larger run at four workers until metrics recover.
    fallback:
      failureThreshold: 3
      replicas: 4
      behavior: currentReplicasIfLower
    redis:
      triggerAuthenticationName: ptr-worker-redis
      existingSecret: ptr-keda-redis
      addressKey: REDIS_ADDRESS
      usernameKey: REDIS_USERNAME
      passwordKey: REDIS_PASSWORD
      caKey: ""
      tlsKey: ""
      waitList: ptr:turns:wait
      waitListLength: "8"
      waitActivationListLength: "1"
      activeList: ptr:turns:active
  engine:
    enabled: true
    pollingInterval: 10
    cooldownPeriod: 120
    minReplicaCount: 1
    maxReplicaCount: 32
    scaleUpStabilizationSeconds: 60
    scaleDownStabilizationSeconds: 600
    fallback:
      failureThreshold: 3
      # currentReplicasIfLower emits the current engine count when it is below
      # fallback.replicas, otherwise fallback.replicas. The template sets
      # fallback.replicas to maxReplicaCount so an outage cannot scale engines
      # down inside the configured GPU range.
      behavior: currentReplicasIfLower
    redis:
      clusterTriggerAuthenticationName: ptr-keda-redis
      existingSecret: ptr-keda-redis
      addressKey: REDIS_ADDRESS
      usernameKey: REDIS_USERNAME
      passwordKey: REDIS_PASSWORD
      caKey: ""
      tlsKey: ""
      waitList: ptr:turns:wait
      activeList: ptr:turns:active
    prometheus:
      serverAddress: ""
      kvThreshold: "0.8"

monitoring:
  prometheus:
    releaseName: ptr-monitoring
    namespace: ptr-monitoring
    port: 9090
  serviceMonitors:
    enabled: true
    interval: 15s
    api:
      path: /metrics/prom
    engine:
      path: /metrics

maintenance:
  enabled: false
  secretName: ptr-maintenance
  timeZone: Asia/Seoul
  startingDeadlineSeconds: 600
  activeDeadlineSeconds: 310
  reviewStateDir: /tmp/ptr-maintenance-review-state
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  schedules:
    dailySplitRetention: "15 3 * * *"
    dailyFrameworkRetention: "25 3 * * *"
    weeklyReviewSample: "45 3 * * 1"
    weeklyProductionReview: "55 3 * * 1"
  jobs:
    dailySplitRetention:
      enabled: true
    dailyFrameworkRetention:
      enabled: true
    weeklyReviewSample:
      enabled: false
      syntheticSmoke: false
    weeklyProductionReview:
      enabled: false
      syntheticSmoke: false
  resources:
    python:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    ts:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}

data:
  enabled: false
  postgres:
    storage: 2Gi
    nodeSelector: {}
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
  redis:
    storage: 1Gi
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}

# These names refer to preexisting Secrets. No chart template creates credentials.
secrets:
  api: {existingSecret: ptr-api}
  worker: {existingSecret: ptr-worker}
  workerOpenRouter:
    existingSecret: ptr-worker-openrouter
    apiKeyKey: OPENROUTER_API_KEY
  maintenance: {existingSecret: ptr-maintenance}
  personas: {existingSecret: ptr-personas}
  data: {existingSecret: ptr-data}

network:
  postgres:
    host: ptr-postgres.ptr-data.svc
    port: 5432
    scheme: postgresql
    database: ptr_split_test
  redis:
    host: ptr-redis.ptr-data.svc
    port: 6379
    scheme: redis
    username: ptr
  api:
    url: http://ptr-api.ptr-app.svc:56441
  worker:
    url: http://ptr-worker.ptr-app.svc:58442

policy:
  # policy.enabled controls all NetworkPolicy resources rendered by this chart.
  # Set false only in clusters where another policy layer enforces equivalent boundaries.
  enabled: true
  # policy.gateway identifies the ingress-controller namespace allowed to reach ptr-web.
  # Kubernetes injects the immutable kubernetes.io/metadata.name label on every namespace.
  gateway:
    namespace: gateway
  managedData:
    postgres: {cidrs: []}
    redis: {cidrs: []}
  apiServerCIDRs: []
  apiServerPorts: [443]

llm:
  local:
    baseUrl: http://chat-primary-epp.ptr-inference.svc.cluster.local:8081/v1
    model: synthetic-chat
    authRequired: false
    inputBytes: 65536
    timeoutMs: 25000
  openrouter:
    model: google/gemma-4-26b-a4b-it
    baseUrlOverride: ""
    syntheticProviderFixture: false
    keyMaxLimitUsd: "1"
  billing:
    liveEnabled: "1"
    allowExternalData: "1"
    promptUsdPerM: "0.10"
    completionUsdPerM: "0.50"
    maxOutputTokens: 512
    maxCallMicrousd: 100000
  spillover: openrouter
  fakeOpenRouter:
    enabled: false
    cost: "0.000123"
    emitCostHeader: true
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
  prod:
    externalHttpsCidrs: []

inference:
  enabled: true
  pool: chat-primary
  routerService: chat-primary-epp
  apiServerCIDRs: []
  # Most managed clusters expose the API server on 443; direct kube-apiserver
  # endpoints may require 6443.
  apiServerPort: 443
  testClient:
    enabled: false
    label: ptr.io/inference-test-client
  engine:
    kind: sim
    replicas: 2
    rollout:
      maxSurge: 0
      maxUnavailable: 1
    model: synthetic-chat
    modelPath: ""
    maxNumSeqs: 2
    dtype: ""
    enforceEager: false
    maxModelLen: 0
    weights:
      existingClaim: ""
      mountPath: /models
      shmSizeLimit: 1Gi
    image:
      repository: ghcr.io/llm-d/llm-d-inference-sim
      tag: v0.11.4
      digest: sha256:d60f0fb00ac62d0eb7c100e7a6816b8acec487aa06f0f38dba72b0ab1754e8f6
      pullPolicy: IfNotPresent
    nodeSelector:
      ptr.io/fake-gpu: "true"
    tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
    timeToFirstToken: 8s
    interTokenLatency: 100ms
    enableRequestIdHeaders: false
    logHttp: false
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
