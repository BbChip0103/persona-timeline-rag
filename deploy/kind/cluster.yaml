kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ptr-k8s
nodes:
  - role: control-plane
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ptr.io/non-gpu=true"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ptr.io/fake-gpu=true,accelerator=fake-gpu"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ptr.io/fake-gpu=true,accelerator=fake-gpu"
