# kube-prometheus-stack chart 92.3.1: operator, Prometheus, and a scoped
# kube-state-metrics deployment collector for engine scale-up detection.
defaultRules:
  create: false
alertmanager:
  enabled: false
grafana:
  enabled: false
kubeApiServer:
  enabled: false
kubelet:
  enabled: false
kubeControllerManager:
  enabled: false
coreDns:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeStateMetrics:
  enabled: true
kube-state-metrics:
  collectors: [deployments]
  namespaces: ptr-inference
  rbac:
    useClusterRole: false
  resources:
    requests: {cpu: 10m, memory: 64Mi}
nodeExporter:
  enabled: false
prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
prometheus:
  prometheusSpec:
    replicas: 1
    retention: 24h
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    resources:
      requests: {cpu: 100m, memory: 256Mi}
