# Override infra/compose.app.yml; all relative paths resolve from its infra/ directory.
# Existing approved split PG/queue are external prerequisites, not recreated here.
name: ${PTR_OPERATIONAL_PROJECT:?select the owned operational project}

services:
  api:
    image: ${PTR_OPERATIONAL_BACKEND_IMAGE:?select the verified backend image}
    labels:
      ptr.operational.owner: ${PTR_OPERATIONAL_OWNER:?required}
  web:
    image: ${PTR_OPERATIONAL_BACKEND_IMAGE:?required}
    env_file: !override
      - path: ${PTR_OPERATIONAL_WEB_ENV_FILE:?private web-only environment}
        required: true
    volumes: !reset []
    depends_on:
      api:
        condition: service_healthy
    labels:
      ptr.operational.owner: ${PTR_OPERATIONAL_OWNER:?required}
  worker:
    image: ${PTR_OPERATIONAL_WORKER_IMAGE:?select the verified Python image}
    # Publish only the verified database-bound snapshot; never expose all imported
    # historical/synthetic cards or mount the operator credential directory.
    volumes: !override
      - type: bind
        source: ${PTR_OPERATIONAL_PUBLISHED_PERSONAS_FILE:?private approved publication snapshot}
        target: /app/published-personas.private.json
        read_only: true
        bind:
          create_host_path: false
    # Native BullMQ waits accepted processors; keep the backend alive during drain.
    stop_grace_period: 90s
    depends_on:
      api:
        condition: service_healthy
    labels:
      ptr.operational.owner: ${PTR_OPERATIONAL_OWNER:?required}
