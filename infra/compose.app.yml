# Production profile : one image (../Dockerfile), API, Nest BullMQ worker and Next web only, TypeScript through tsx.
# Host network: the roles keep their loopback-only guards and fixed 127.0.0.1 ports (Linux only). Postgres and Redis
# use separately provisioned isolated services; a role started before them keeps reconnecting,
# and the api reports unhealthy until both answer. Synthetic targets are in compose.framework.yml.
#
#   PTR_FRAMEWORK_APP_ENV_FILE=<new-framework-app-env> docker compose --env-file <new-framework-app-env> -f infra/compose.app.yml up -d
#
# `--env-file` lets Compose read PTR_UID / PTR_GID values for the
# mounts below; PTR_FRAMEWORK_APP_ENV_FILE explicitly selects the new file to the roles. Procedures: docs/framework-runtime.md.
name: ptr_app

x-role: &role
  image: ptr_app:local
  build:
    context: ..
  network_mode: host
  user: "${PTR_UID:-900}:${PTR_GID:-2000}"
  init: true
  env_file:
    - path: ${PTR_FRAMEWORK_APP_ENV_FILE:?select a new explicit private framework app environment}
      required: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

# Personas are read from data/ (repo-relative paths, `ops:check-env` path_not_repo_relative); generated drafts are the
# only writes. Neither directory is created by Compose: a missing one stops `up` instead of appearing root-owned.
x-data: &data
  - type: bind
    source: ../data
    target: /app/data
    read_only: true
    bind:
      create_host_path: false
  - type: bind
    source: ../data/generated
    target: /app/data/generated
    bind:
      create_host_path: false

services:
  api:
    <<: *role
    command: [node, --import, tsx, apps/api/src/main.ts]
    volumes: *data
    healthcheck:
      # D23: 200 only when the database answers SELECT 1 and Redis PING.
      test: [CMD, node, -e, "fetch('http://127.0.0.1:56441/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    <<: *role
    command: [node, --import, tsx, apps/api/src/worker.ts]
    volumes: *data
    # A running turn has a 30 s deadline; SIGTERM lets the worker finish it before the stop.
    stop_grace_period: 35s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:56442/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    <<: *role
    working_dir: /app/apps/web
    command: [node, node_modules/next/dist/bin/next, start, --hostname, 127.0.0.1, --port, "56440"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:56440/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
