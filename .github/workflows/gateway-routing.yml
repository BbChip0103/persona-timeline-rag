name: gateway-routing
on:
  push:
    paths: ['infra/litellm/**', 'infra/compose.framework.yml', 'infra/langfuse/init-framework-env.py', 'apps/llm-service/uv.lock', '.github/workflows/gateway-routing.yml']
  pull_request:
    paths: ['infra/litellm/**', 'infra/compose.framework.yml', 'infra/langfuse/init-framework-env.py', 'apps/llm-service/uv.lock', '.github/workflows/gateway-routing.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gateway-routing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports: ['6379/tcp']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.5'
      - run: python -m pip install uv==0.10.2
      - run: uv sync --project apps/llm-service --locked
      - name: Routing lint, types and synthetic regressions
        env:
          PTR_ROUTING_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0
        run: |
          uv run --project apps/llm-service ruff check infra/litellm/*.py
          uv run --project apps/llm-service mypy infra/litellm/ptr_routing.py infra/litellm/routing_state.py infra/litellm/routing_telemetry.py --ignore-missing-imports
          uv run --project apps/llm-service python infra/litellm/test-routing-telemetry.py
          uv run --project apps/llm-service python infra/litellm/test-routing-state.py
          uv run --project apps/llm-service python infra/litellm/test-routing-callback.py
      - name: Two real pinned Proxies, isolated synthetic engines and shared credit
        run: uv run --project apps/llm-service python infra/litellm/routing-smoke.py
