#  (D24).
# - check: every push and pull request. No secrets, and the checkout has no data/ and no .env* (the clean-clone
#   acceptance), so a test that depends on a private local file fails here.
# - integration: historical scientific Postgres and Redis regression suites, on main/manual runs, against throwaway containers on the
#   runner (synthetic ptr_loadtest database, Redis with the repo's ACL config). Credentials are generated per run.
# - framework-integration: the migrated framework's six bounded suites against its own generated DB/queue only.
name: ci

on:
  push:
    paths-ignore: ['apps/llm-service/**', 'scripts/split-memory-proof.py']
  pull_request:
    paths-ignore: ['apps/llm-service/**', 'scripts/split-memory-proof.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push cancels an older run, except on main, where the integration job must finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - name: Enable pnpm (packageManager in package.json)
        run: corepack enable pnpm
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0
      - name: Install verified Docker Compose v5.5.1
        run: |
          compose_binary="$RUNNER_TEMP/docker-compose-linux-x86_64"
          timeout 60s curl --fail --silent --show-error --location --max-time 55 \
            https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64 \
            --output "$compose_binary"
          printf '%s  %s\n' 'db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576' "$compose_binary" | sha256sum --check --status
          install -d "$HOME/.docker/cli-plugins"
          install -m 0755 "$compose_binary" "$HOME/.docker/cli-plugins/docker-compose"
          test "$(timeout 10s docker compose version --short)" = '5.5.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Compose file renders
        run: |
          env_file="$RUNNER_TEMP/ptr-framework-check.env"
          role_env="$RUNNER_TEMP/ptr-compose-placeholder.env"
          published="$RUNNER_TEMP/ptr-compose-placeholder.json"
          python3 infra/langfuse/init-framework-env.py --output "$env_file"
          : > "$role_env"
          printf '{}\n' > "$published"
          PTR_FRAMEWORK_APP_ENV_FILE="$env_file" PTR_LLM_SERVICE_ENV_FILE="$env_file" docker compose --env-file "$env_file" -f infra/compose.app.yml config -q
          docker compose --env-file "$env_file" -f infra/compose.framework.yml --profile smoke --profile observability --profile guardrails --profile runtime-test config -q
          PTR_OPERATIONAL_PROJECT=ptr-ci-local PTR_OPERATIONAL_OWNER=synthetic-ci \
            PTR_OPERATIONAL_BACKEND_IMAGE=synthetic-backend:local PTR_OPERATIONAL_WORKER_IMAGE=synthetic-worker:local \
            PTR_FRAMEWORK_APP_ENV_FILE="$role_env" PTR_LLM_SERVICE_ENV_FILE="$role_env" \
            PTR_OPERATIONAL_WEB_ENV_FILE="$role_env" PTR_OPERATIONAL_PUBLISHED_PERSONAS_FILE="$published" \
            docker compose --env-file "$env_file" -f infra/compose.app.yml -f infra/split/compose.operational.yml config -q
      - name: Offline framework deployment and fixture regressions
        run: |
          python3 infra/langfuse/test-deployment.py
          python3 infra/fake-engine/test-fake-engine.py
          python3 infra/fake-openrouter/test-fake-openrouter.py
      - name: Root pytest suite
        run: |
          python3 -m venv "$RUNNER_TEMP/ptr-root-tests-venv"
          "$RUNNER_TEMP/ptr-root-tests-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/ptr-root-tests-venv/bin/python" -m pip install -e '.[dev]'
          PYTHONPATH=src "$RUNNER_TEMP/ptr-root-tests-venv/bin/python" -m pytest tests
          "$RUNNER_TEMP/ptr-root-tests-venv/bin/python" deploy/helm/ptr/tests/l4-chart-contracts.py
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: Remove this check's private generated configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/ptr-framework-check.env" "$RUNNER_TEMP/ptr-compose-placeholder.env" "$RUNNER_TEMP/ptr-compose-placeholder.json"

  backend-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build thin backend and web image (independent production lock)
        run: docker build -t ptr-backend-ci:${{ github.sha }} .
      - name: Non-root synthetic startup, shutdown and zero installed or loaded LLM SDKs
        run: docker run --rm ptr-backend-ci:${{ github.sha }} node --import tsx infra/backend/image-smoke.ts
      - name: Historical in-process worker cannot be selected in deployed image
        run: |
          output=$(docker run --rm -e PTR_LLM_SERVICE_MODE=legacy ptr-backend-ci:${{ github.sha }} 2>&1) && exit 1
          test "$output" = 'API_STARTUP_FAILED LEGACY_RUNTIME_NOT_PACKAGED'

  k8s-chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0
      - name: Install kubeconform v0.8.0
        run: |
          install_dir="$RUNNER_TEMP/kubeconform"
          mkdir -p "$install_dir"
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o "$install_dir/kubeconform.tar.gz"
          echo '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz' | (cd "$install_dir" && sha256sum -c -)
          tar -C "$install_dir" -xzf "$install_dir/kubeconform.tar.gz" kubeconform
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Helm lint
        run: |
          (cd deploy/helm/ptr-router && sha256sum -c llm-d-router-standalone.sha256)
          helm lint --strict deploy/helm/ptr --values deploy/helm/ptr/values-kind.yaml
          helm lint --strict deploy/helm/ptr --values deploy/helm/ptr/values-prod.yaml
          helm lint --strict deploy/helm/ptr-router --values deploy/helm/ptr-router/values-kind.yaml
          helm lint --strict deploy/helm/ptr-router --values deploy/helm/ptr-router/values-prod.yaml
      - name: Prod render excludes synthetic OpenRouter fixture settings
        run: bash deploy/helm/ptr/tests/prod-render-no-kind-fixtures.sh
      - name: Synthetic bootstrap SQL matches the source migrations
        run: |
          set -euo pipefail
          diff -r supabase/migrations deploy/helm/ptr/files/supabase/migrations
          diff -r supabase/split deploy/helm/ptr/files/supabase/split
      - name: Fake OpenRouter chart file matches source file
        run: |
          set -euo pipefail
          diff -u infra/fake-openrouter/fake-openrouter.py deploy/helm/ptr/files/fake-openrouter/fake-openrouter.py
      - name: Kind image prune selection
        run: bash deploy/kind/test-up-prune.sh
      - name: Kubernetes schema validation
        run: |
          set -euo pipefail
          validate_crd_kind() {
            local rendered="$1"
            local kind="$2"
            local schema="${3:-$kind}"
            local docs="$RUNNER_TEMP/${kind}.yaml"
            awk -v kind="$kind" 'BEGIN{RS="---"; ORS="\n---\n"} $0 ~ ("(^|\n)kind: " kind "(\n|$)") {print $0}' "$rendered" > "$docs"
            if ! [ -s "$docs" ]; then
              printf 'missing expected CRD kind: %s\n' "$kind" >&2
              exit 1
            fi
            kubeconform -strict -summary -schema-location "file://$PWD/deploy/helm/ptr/schemas/${schema}.json" "$docs"
          }
          validate_render() {
            local chart="$1"
            local release="$2"
            local namespace="$3"
            local values="$4"
            shift 4
            local rendered
            rendered="$RUNNER_TEMP/${release}-${namespace}-$(basename "$values").yaml"
            helm template "$release" "$chart" --namespace "$namespace" --values "$values" > "$rendered"
            if [[ "$chart" == deploy/helm/ptr ]]; then
              test "$(grep -c '^kind: ServiceMonitor$' "$rendered")" -eq 3
            fi
            kubeconform -strict -summary -skip InferencePool,ScaledObject,TriggerAuthentication,ClusterTriggerAuthentication,ServiceMonitor -schema-location default "$rendered"
            for expected in "$@"; do
              local kind="${expected%%:*}"
              local schema="${expected#*:}"
              validate_crd_kind "$rendered" "$kind" "$schema"
            done
          }
          validate_render deploy/helm/ptr ptr ptr-system deploy/helm/ptr/values-kind.yaml InferencePool:InferencePool-v1 ScaledObject TriggerAuthentication ClusterTriggerAuthentication ServiceMonitor
          validate_render deploy/helm/ptr ptr ptr-system deploy/helm/ptr/values-prod.yaml InferencePool:InferencePool-v1 ScaledObject TriggerAuthentication ClusterTriggerAuthentication ServiceMonitor
          validate_render deploy/helm/ptr-router chat-primary ptr-inference deploy/helm/ptr-router/values-kind.yaml ServiceMonitor
          validate_render deploy/helm/ptr-router chat-primary ptr-inference deploy/helm/ptr-router/values-prod.yaml ServiceMonitor

  integration:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # pgvector on PostgreSQL 15 (the local Supabase distribution is 15 as well); migrations need only `vector`.
        image: pgvector/pgvector:0.8.1-pg15@sha256:94aee7e88f98125114657cab98e28c5dfa8dd517a6bf83fd98b503439f1e3de6
        env:
          # Bootstrap superuser named like the Supabase distribution's, so infra/init-loadtest-db.sh runs unchanged.
          POSTGRES_USER: supabase_admin
          POSTGRES_DB: postgres
          # Service containers start before any step, so no generated password exists yet: the bootstrap uses trust on
          # this throwaway, loopback-published database. The application role still gets a generated password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:56432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - name: Enable pnpm (packageManager in package.json)
        run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate throwaway credentials
        run: |
          for name in PTR_LOADTEST_DB_PASSWORD PTR_REDIS_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done
      - name: Create the synthetic ptr_loadtest database and role
        run: docker exec -i -e PTR_LOADTEST_DB_PASSWORD "${{ job.services.postgres.id }}" bash -s < infra/init-loadtest-db.sh
      # GitHub service containers cannot set a command, so Redis runs from the repo's compose file: the same ACL
      # (user ptr, default off), noeviction and AOF as production.
      - name: Start Redis with the ACL config
        run: docker compose -f infra/compose.redis.yml up -d --wait redis
      - name: Connection URLs
        run: |
          echo "DATABASE_URL=postgresql://ptr_loadtester:${PTR_LOADTEST_DB_PASSWORD}@127.0.0.1:56432/ptr_loadtest" >> "$GITHUB_ENV"
          echo "PTR_REDIS_URL=redis://ptr:${PTR_REDIS_PASSWORD}@127.0.0.1:56479/0" >> "$GITHUB_ENV"
      - run: pnpm db:migrate
      - name: Unit, Postgres and Redis suites
        run: GOAL1_TEST_DATABASE_URL="$DATABASE_URL" pnpm test
        env:
          RUN_STORAGE_DB_TESTS: "1"
          RUN_REDIS_TESTS: "1"
          GOAL1_TEST_BUDGET_DB: "true"
      - name: Remove Redis
        if: always()
        run: docker compose -f infra/compose.redis.yml down --volumes

  framework-integration:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - name: Enable pnpm (packageManager in package.json)
        run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate private synthetic framework configuration
        run: |
          env_file="$RUNNER_TEMP/ptr-framework-integration.env"
          python3 infra/langfuse/init-framework-env.py --output "$env_file"
          # This file was exclusively created by this job; no existing/private deployment env is loaded.
          set -a
          # shellcheck disable=SC1090
          source "$env_file"
          set +a
          db_url="postgresql://ptr_framework_tester:${PTR_FRAMEWORK_TEST_DB_PASSWORD}@127.0.0.1:57432/ptr_framework_test"
          redis_url="redis://:${PTR_FRAMEWORK_QUEUE_PASSWORD}@127.0.0.1:57479/0"
          for value in "$PTR_FRAMEWORK_BOOTSTRAP_PASSWORD" "$PTR_FRAMEWORK_TEST_DB_PASSWORD" "$PTR_FRAMEWORK_QUEUE_PASSWORD" "$db_url" "$redis_url"; do
            echo "::add-mask::${value}"
          done
          printf 'DATABASE_URL=%s\nPTR_FRAMEWORK_TEST_DATABASE_URL=%s\n' "$db_url" "$db_url" >> "$GITHUB_ENV"
          printf 'PTR_REDIS_URL=%s\nPTR_FRAMEWORK_TEST_REDIS_URL=%s\n' "$redis_url" "$redis_url" >> "$GITHUB_ENV"
      - name: Start only the new synthetic DB and queue
        run: |
          docker compose --env-file "$RUNNER_TEMP/ptr-framework-integration.env" -f infra/compose.framework.yml --profile runtime-test up -d --wait framework-test-db framework-test-queue
      - name: Explicit framework migrations and checkpoint setup
        run: |
          pnpm db:migrate
          pnpm framework:checkpoints
      - name: Six bounded real framework integration suites
        run: |
          pnpm exec jest --runInBand --runTestsByPath \
            apps/api/tests/postgres-checkpoint.integration.test.ts \
            apps/api/tests/queue-worker.integration.test.ts \
            packages/core/tests/postgres-checkpoint.integration.test.ts \
            packages/storage/test/framework-executions.integration.test.ts \
            scripts/framework-checkpoint-retention.integration.test.ts \
            scripts/framework-receipt-retention.integration.test.ts
      - name: Remove only this synthetic project's DB and queue
        if: always()
        run: |
          env_file="$RUNNER_TEMP/ptr-framework-integration.env"
          if [ -f "$env_file" ]; then
            docker compose --env-file "$env_file" -f infra/compose.framework.yml --profile runtime-test down --volumes
            rm -f "$env_file"
          fi
