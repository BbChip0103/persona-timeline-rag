[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-timeline-rag"
version = "0.1.0"
description = "Evidence-grounded personal timeline research from licensed social media data"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "tenacity==9.2.1", "beautifulsoup4==4.15.0"]

[project.scripts]
persona-timeline = "persona_timeline_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
