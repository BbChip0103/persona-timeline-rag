[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ptr-llm-service"
version = "0.1.0"
description = "Independent Python orchestration, evaluation and ingestion service"
requires-python = ">=3.13,<3.14"
dependencies = [
  "bullmq==3.3.3",
  "fastapi>=0.115,<1",
  "guardrails-ai==0.11.0",
  "httpx>=0.28,<1",
  "jsonschema==4.26.0",
  "langchain-classic==1.0.8",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "langfuse==4.17.0",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.11,<3",
  "redis>=6,<9",
  "regex==2026.9.29",
  "uvicorn>=0.35,<1",
  "persona-timeline-rag",
]

[project.scripts]
ptr-llm = "ptr_llm.cli:main"

[tool.uv.sources]
persona-timeline-rag = { path = "../..", editable = true }

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mypy>=1.16,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/ptr_llm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
